# Apache 2.4 reverse proxy for Chinwag (example — review before use; not installed automatically).
# Required modules: proxy proxy_http proxy_wstunnel headers rewrite ssl
#   a2enmod proxy proxy_http proxy_wstunnel headers rewrite ssl   (Debian, non-DirectAdmin)

<VirtualHost *:80>
    ServerName chat.example.com
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/(.*)$ https://chat.example.com/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName chat.example.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/chat.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/chat.example.com/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    # Attachment uploads (bytes)
    LimitRequestBody 157286400
    ProxyTimeout 600

    # WebSockets for Socket.IO
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/socket\.io/(.*)$ ws://127.0.0.1:3100/socket.io/$1 [P,L]

    # MCP Streamable HTTP — disable buffering/compression so streamed responses flush
    <Location "/mcp">
        SetEnv proxy-sendchunked 1
        SetEnv no-gzip 1
    </Location>
    # More specific ProxyPass rules must come before "/"
    ProxyPass        /mcp http://127.0.0.1:3100/mcp flushpackets=on timeout=600
    ProxyPassReverse /mcp http://127.0.0.1:3100/mcp

    ProxyPass        /socket.io/ http://127.0.0.1:3100/socket.io/
    ProxyPassReverse /socket.io/ http://127.0.0.1:3100/socket.io/
    ProxyPass        / http://127.0.0.1:3100/ timeout=300
    ProxyPassReverse / http://127.0.0.1:3100/
</VirtualHost>
