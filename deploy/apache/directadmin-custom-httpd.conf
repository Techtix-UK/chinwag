# DirectAdmin: Admin Level → Custom HTTPD Configurations → whatsapp.techtixglobal.com → httpd.conf
# Paste into the "CUSTOM" token area (|*if SSL_TEMPLATE="1"|) so it applies to the HTTPS virtual host.
# DirectAdmin manages the SSL certificate (Let's Encrypt) for the domain/subdomain.
# This only adds proxy rules for this one domain and does not affect other sites.

|*if SSL_TEMPLATE="1"|
    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    LimitRequestBody 157286400
    ProxyTimeout 600

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/socket\.io/(.*)$ ws://127.0.0.1:3100/socket.io/$1 [P,L]

    <Location "/mcp">
        SetEnv proxy-sendchunked 1
        SetEnv no-gzip 1
    </Location>
    ProxyPass /mcp http://127.0.0.1:3100/mcp flushpackets=on timeout=600
    ProxyPassReverse /mcp http://127.0.0.1:3100/mcp
    ProxyPass /socket.io/ http://127.0.0.1:3100/socket.io/
    ProxyPassReverse /socket.io/ http://127.0.0.1:3100/socket.io/
    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass / http://127.0.0.1:3100/ timeout=300
    ProxyPassReverse / http://127.0.0.1:3100/
|*else|
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
|*endif|
