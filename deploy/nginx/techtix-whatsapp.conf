# Nginx reverse proxy for Techtix WhatsApp (example — review before use; not installed automatically).
# TLS certificates: certbot (Let's Encrypt) or your provider. Replace paths as required.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream techtix_whatsapp {
    server 127.0.0.1:3100;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name whatsapp.techtixglobal.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name whatsapp.techtixglobal.com;

    ssl_certificate     /etc/letsencrypt/live/whatsapp.techtixglobal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whatsapp.techtixglobal.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Attachment uploads (keep >= Settings → Maximum attachment size, plus base64 overhead for API uploads)
    client_max_body_size 150m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Socket.IO (WebSockets) for real-time dashboard updates
    location /socket.io/ {
        proxy_pass http://techtix_whatsapp;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # MCP Streamable HTTP: no buffering so streamed responses reach the client immediately
    location = /mcp {
        proxy_pass http://techtix_whatsapp;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://techtix_whatsapp;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
